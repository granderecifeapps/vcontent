services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vcontent
      POSTGRES_PASSWORD: vcontent
      POSTGRES_DB: vcontent
    ports:
      - "5433:5432"
    volumes:
      - vcontent_pg:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcontent -d vcontent"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: vcontent
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - vcontent_minio:/bitnami/minio/data

volumes:
  vcontent_pg:
  vcontent_minio:
